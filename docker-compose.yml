services:
  postgres:
    image: postgres:16-alpine
    container_name: celesnity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-celesnity}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-celesnity}
      POSTGRES_DB: ${DB_NAME:-celesnity}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-celesnity} -d ${DB_NAME:-celesnity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celesnity-backend
    restart: unless-stopped
    # Runs the real, committed migration history (backend/prisma/migrations/,
    # baselined in Step 6 — see README's "Step 6 — HOÀN TẤT" entry) against
    # whatever Postgres this container's DATABASE_URL points at, every time
    # the container starts, BEFORE the app itself starts. Without this,
    # nothing anywhere ever applied a migration on a fresh DB — every prior
    # verification ran against a Postgres volume that had already been
    # migrated once by hand and then reused across dozens of `docker
    # compose up` runs, so the gap stayed invisible until the first real
    # `docker compose down -v` (clean-clone simulation) — see README's
    # final pre-submission entry for the full incident. `command:` must be
    # a top-level key of the `backend:` service, NOT nested under `build:`
    # (that specific mistake fails with "services.backend.build Additional
    # property 'command' is not allowed").
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-celesnity}
      DB_PASSWORD: ${DB_PASSWORD:-celesnity}
      DB_NAME: ${DB_NAME:-celesnity}
      # Prisma (Step 5) reads a single connection string — internal Docker
      # network port (5432), not the 5433 host-side remap used outside the
      # container.
      DATABASE_URL: postgresql://${DB_USER:-celesnity}:${DB_PASSWORD:-celesnity}@postgres:5432/${DB_NAME:-celesnity}
      # Step 6: "Application API" collector target. Internal Docker network
      # hostname/port (4000), not the 4100 host-side remap below.
      # FIXTURE_API_KEY is the actual secret value — CollectionRunsService
      # reads it from this env var by name (Source.config only stores the
      # env var's NAME, never the value; see collection-runs.service.ts).
      FIXTURE_API_BASE_URL: http://fixture-api:4000
      FIXTURE_API_KEY: ${FIXTURE_API_KEY:-fixture-secret-key}
      # Step 7: real password for the "Production Database" collector.
      # CollectionRunsService/SourcesService read it from this env var by
      # name — Source.config only ever stores "PRODUCTION_DB_PASSWORD" (the
      # NAME), never the value, same pattern as FIXTURE_API_KEY above. Host/
      # port/database/user are NOT secret and are supplied directly in
      # Source.config when a Source is registered (POST /sources), not via
      # env — only the credential is indirected.
      PRODUCTION_DB_PASSWORD: ${PRODUCTION_DB_PASSWORD:-prod-db-secret-password}
      # Step 8: no fixed env var here on purpose — unlike fixture-api/
      # production-db, a CRAWLER Source's baseUrl is supplied directly in
      # Source.config at registration time (POST /sources), not read from
      # a static env var, because the supplier portal needs no secret at
      # all (see collection-runs/types.ts's CrawlerSourceConfig). backend
      # still depends_on it below purely for startup ordering.
      # Step 10: freshness threshold ("must be configurable") for GET
      # /production-lines. Minutes since a batch's latest ACCEPTED
      # eventTime before it's reported STALE.
      STALE_THRESHOLD_MINUTES: ${STALE_THRESHOLD_MINUTES:-15}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      fixture-api:
        condition: service_healthy
      production-db:
        condition: service_healthy
      supplier-portal:
        condition: service_healthy

  # Step 6: mock "Application API" — see fixture-api/server.js.
  fixture-api:
    build:
      context: ./fixture-api
    container_name: celesnity-fixture-api
    restart: unless-stopped
    environment:
      PORT: 4000
      FIXTURE_API_KEY: ${FIXTURE_API_KEY:-fixture-secret-key}
      # Default fault mode for the long-running compose instance — keep
      # "none" so the app behaves normally; override per-run for manual
      # fault-injection testing (see README "Việc cần làm ở máy có Docker").
      FIXTURE_FAULT_MODE: ${FIXTURE_FAULT_MODE:-none}
    ports:
      - "4100:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Step 7: "Production Database" — a genuinely separate Postgres instance
  # from `postgres` above (that one holds this app's own canonical data;
  # this one stands in for the factory's own, external production-line
  # database that the Step 7 collector registers/verifies/discovers/
  # selects/collects from). Official postgres image, no custom Dockerfile —
  # `production-db/init.sql` seeds it via Postgres's own
  # /docker-entrypoint-initdb.d/ mechanism on first start.
  production-db:
    image: postgres:16-alpine
    container_name: celesnity-production-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PRODUCTION_DB_USER:-prod_reader}
      POSTGRES_PASSWORD: ${PRODUCTION_DB_PASSWORD:-prod-db-secret-password}
      POSTGRES_DB: ${PRODUCTION_DB_NAME:-production}
    ports:
      - "5434:5432"
    volumes:
      - production_db_data:/var/lib/postgresql/data
      - ./production-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCTION_DB_USER:-prod_reader} -d ${PRODUCTION_DB_NAME:-production}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Step 8: "Supplier Portal" — a locally hosted, paginated HTML page
  # standing in for a real supplier's delivery-record portal (see
  # supplier-portal/server.js). Zero dependencies, no custom build step
  # needed beyond copying the two files (mirrors fixture-api). No secret —
  # the assessment describes this as a public page, not a credentialed API.
  supplier-portal:
    build:
      context: ./supplier-portal
    container_name: celesnity-supplier-portal
    restart: unless-stopped
    environment:
      PORT: 4200
      # Default fault mode for the long-running compose instance — keep
      # "none" so the app behaves normally; override per-run for manual
      # malformed-row/pagination-loop testing (see README "Việc cần làm ở
      # máy có Docker").
      SUPPLIER_PORTAL_FAULT_MODE: ${SUPPLIER_PORTAL_FAULT_MODE:-none}
    ports:
      - "4300:4200"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4200/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: celesnity-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  production_db_data:
